#config_version=6

mode:
  start_events: start_mode_sparring_with_semmi
  priority: 300
  stop_events: stop_mode_sparring_with_semmi

shots:
  z_spar_1: { switch: s_left_ramp_made, profile: mode_shot, show_tokens: { lights: l_lane_left_ramp } }
  z_spar_2: { switch: s_right_ramp_made, profile: mode_shot, show_tokens: { lights: lane_right_ramp } }
  z_spar_3: { switch: s_center_vuk, profile: mode_shot, show_tokens: { lights: inline_drop_arrow } }

counters:
  z_spar_seq:
    count_events: z_spar_1_ready_hit, z_spar_2_ready_hit, z_spar_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: sparring_with_semmi_complete

event_player:
  sparring_with_semmi_complete:
    - stop_mode_sparring_with_semmi
    - start_mode_the_royal_wedding


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_sparring_with_semmi_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_sparring, color: cta_gold }
