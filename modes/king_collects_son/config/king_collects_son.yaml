#config_version=6

mode:
  start_events: start_mode_king_collects_son
  priority: 300
  stop_events: stop_mode_king_collects_son

shots:
  q_king_1: { switch: s_left_orbit_made, profile: mode_shot, show_tokens: { lights: lane_left_orbit } }
  q_king_2: { switch: s_right_orbit_made, profile: mode_shot, show_tokens: { lights: lane_right_orbit } }
  q_king_3: { switch: s_center_vuk, profile: mode_shot, show_tokens: { lights: inline_drop_arrow } }

counters:
  q_king_seq:
    count_events: q_king_1_ready_hit, q_king_2_ready_hit, q_king_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: king_collects_son_complete

event_player:
  king_collects_son_complete:
    - stop_mode_king_collects_son


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_king_collects_son_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_kings_son, color: cta_gold }
