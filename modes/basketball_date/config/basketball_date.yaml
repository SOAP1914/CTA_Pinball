#config_version=6

mode:
  start_events: start_mode_basketball_date
  priority: 300
  stop_events: stop_mode_basketball_date

shots:
  q_ball_1: { switch: s_left_orbit_made, profile: mode_shot, show_tokens: { lights: lane_left_orbit } }
  q_ball_2: { switch: s_right_orbit_made, profile: mode_shot, show_tokens: { lights: lane_right_orbit } }
  q_ball_3: { switch: s_left_ramp_made, profile: mode_shot, show_tokens: { lights: l_lane_left_ramp } }

counters:
  q_ball_seq:
    count_events: q_ball_1_ready_hit, q_ball_2_ready_hit, q_ball_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: basketball_date_complete

event_player:
  basketball_date_complete:
    - stop_mode_basketball_date
    - start_mode_thwarting_a_robbery


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_basketball_date_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_saint_johns, color: cta_gold }
