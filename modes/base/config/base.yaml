  # Drop target letters: lit when knocked down, off when reset
  s_soul_s_active: { l_drop_soul_s: cta_gold }
  s_soul_s_inactive: { l_drop_soul_s: "off" }
  s_soul_o_active: { l_drop_soul_o: cta_gold }
  s_soul_o_inactive: { l_drop_soul_o: "off" }
