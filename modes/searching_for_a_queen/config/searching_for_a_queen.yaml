#config_version=6

mode:
  start_events: start_mode_searching_for_a_queen
  priority: 300
  stop_events: stop_mode_searching_for_a_queen

shots:
  q_search_1: { switch: s_left_ramp_made, profile: mode_shot, show_tokens: { lights: l_lane_left_ramp } }
  q_search_2: { switch: s_right_ramp_made, profile: mode_shot, show_tokens: { lights: lane_right_ramp } }
  q_search_3: { switch: s_spinner, profile: single_hit }  # no insert for this switch

counters:
  q_search_seq:
    count_events: q_search_1_ready_hit, q_search_2_ready_hit, q_search_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: searching_for_a_queen_complete

event_player:
  searching_for_a_queen_complete:
    - stop_mode_searching_for_a_queen
    - start_mode_the_barbershop


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_searching_for_a_queen_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_search, color: cta_gold }
