#config_version=6

mode:
  start_events: start_mode_thwarting_a_robbery
  priority: 300
  stop_events: stop_mode_thwarting_a_robbery

shots:
  q_rob_1: { switch: s_right_ramp_made, profile: mode_shot, show_tokens: { lights: lane_right_ramp } }
  q_rob_2: { switch: s_left_inlane, profile: mode_shot, show_tokens: { lights: l_return_lane_left } }
  q_rob_3: { switch: s_center_vuk, profile: mode_shot, show_tokens: { lights: inline_drop_arrow } }

counters:
  q_rob_seq:
    count_events: q_rob_1_ready_hit, q_rob_2_ready_hit, q_rob_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: thwarting_a_robbery_complete

event_player:
  thwarting_a_robbery_complete:
    - stop_mode_thwarting_a_robbery
    - start_mode_would_you_like_to_dance


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_thwarting_a_robbery_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_robbery, color: cta_gold }
