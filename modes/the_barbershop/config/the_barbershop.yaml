#config_version=6

mode:
  start_events: start_mode_the_barbershop
  priority: 300
  stop_events: stop_mode_the_barbershop

shots:
  q_barber_1: { switch: s_left_orbit_made, profile: mode_shot, show_tokens: { lights: lane_left_orbit } }
  q_barber_2: { switch: s_right_inlane, profile: mode_shot, show_tokens: { lights: l_return_lane_right } }
  q_barber_3: { switch: s_left_inlane, profile: mode_shot, show_tokens: { lights: l_return_lane_left } }

counters:
  q_barber_seq:
    count_events: q_barber_1_ready_hit, q_barber_2_ready_hit, q_barber_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: the_barbershop_complete

event_player:
  the_barbershop_complete:
    - stop_mode_the_barbershop
    - start_mode_miss_black_awareness


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_the_barbershop_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_barber, color: cta_gold }
