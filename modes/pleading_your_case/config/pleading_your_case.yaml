#config_version=6

mode:
  start_events: start_mode_pleading_your_case
  priority: 300
  stop_events: stop_mode_pleading_your_case

shots:
  q_plead_1: { switch: s_left_ramp_made, profile: mode_shot, show_tokens: { lights: l_lane_left_ramp } }
  q_plead_2: { switch: s_right_ramp_made, profile: mode_shot, show_tokens: { lights: lane_right_ramp } }
  q_plead_3: { switch: s_spinner, profile: single_hit }  # no insert for this switch

counters:
  q_plead_seq:
    count_events: q_plead_1_ready_hit, q_plead_2_ready_hit, q_plead_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: pleading_your_case_complete

event_player:
  pleading_your_case_complete:
    - stop_mode_pleading_your_case
    - start_mode_king_collects_son


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_pleading_your_case_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_plead, color: cta_gold }
