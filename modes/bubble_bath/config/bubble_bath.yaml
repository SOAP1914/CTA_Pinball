#config_version=6

mode:
  start_events: start_mode_bubble_bath
  priority: 300
  stop_events: stop_mode_bubble_bath

shots:
  z_bath_1: { switch: s_left_orbit_made, profile: mode_shot, show_tokens: { lights: lane_left_orbit } }
  z_bath_2: { switch: s_right_orbit_made, profile: mode_shot, show_tokens: { lights: lane_right_orbit } }
  z_bath_3: { switch: s_spinner, profile: single_hit }  # no insert for this switch

counters:
  z_bath_seq:
    count_events: z_bath_1_ready_hit, z_bath_2_ready_hit, z_bath_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: bubble_bath_complete

event_player:
  bubble_bath_complete:
    - stop_mode_bubble_bath
    - start_mode_sparring_with_semmi


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_bubble_bath_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_bath, color: cta_gold }
