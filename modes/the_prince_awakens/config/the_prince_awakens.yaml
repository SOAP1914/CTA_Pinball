#config_version=6

mode:
  start_events: start_mode_the_prince_awakens
  priority: 300
  stop_events: stop_mode_the_prince_awakens

shots:
  z_awaken_1: { switch: s_left_ramp_made, profile: mode_shot, show_tokens: { lights: l_lane_left_ramp } }
  z_awaken_2: { switch: s_right_ramp_made, profile: mode_shot, show_tokens: { lights: lane_right_ramp } }
  z_awaken_3: { switch: s_center_vuk, profile: mode_shot, show_tokens: { lights: inline_drop_arrow } }
  z_awaken_4: { switch: s_spinner, profile: single_hit }  # no insert for this switch
  z_awaken_5: { switch: s_left_inlane, profile: mode_shot, show_tokens: { lights: l_return_lane_left } }
  z_awaken_6: { switch: s_right_inlane, profile: mode_shot, show_tokens: { lights: l_return_lane_right } }

counters:
  z_awaken_seq:
    count_events: z_awaken_1_ready_hit, z_awaken_2_ready_hit, z_awaken_3_ready_hit, z_awaken_4_ready_hit, z_awaken_5_ready_hit, z_awaken_6_ready_hit
    count_complete_value: 6
    reset_on_complete: true
    events_when_complete: the_prince_awakens_complete

event_player:
  the_prince_awakens_complete:
    - stop_mode_the_prince_awakens
    - start_mode_bubble_bath


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_the_prince_awakens_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_awakens, color: cta_gold }
