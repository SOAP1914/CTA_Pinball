#config_version=6

mode:
  start_events: start_mode_a_royal_celebration
  priority: 300
  stop_events: stop_mode_a_royal_celebration

shots:
  z_cele_1: { switch: s_left_orbit_made, profile: mode_shot, show_tokens: { lights: lane_left_orbit } }
  z_cele_2: { switch: s_right_ramp_made, profile: mode_shot, show_tokens: { lights: lane_right_ramp } }
  z_cele_3: { switch: s_center_vuk, profile: mode_shot, show_tokens: { lights: inline_drop_arrow } }

counters:
  z_cele_seq:
    count_events: z_cele_1_ready_hit, z_cele_2_ready_hit, z_cele_3_ready_hit
    count_complete_value: 3
    reset_on_complete: true
    events_when_complete: a_royal_celebration_complete

event_player:
  a_royal_celebration_complete:
    - stop_mode_a_royal_celebration


# Mode insert flashes while this mode runs (stops automatically when the mode stops)
show_player:
  mode_a_royal_celebration_started:
    flash_color:
      key: mode_insert
      speed: 4
      show_tokens: { lights: l_mode_celebrate, color: cta_gold }
