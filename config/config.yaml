#config_version=6

## MPF Main Machine Config — entry point
#
# This is the thin entry shim. It loads the hardware-independent core
# (_config_core.yaml) then layers on the platform and machine settings.
# To run on different hardware, create a parallel shim (e.g.
# config_virtual.yaml) that loads the same core with a different platform.
#
# DO NOT EDIT IN GODOT — Godot rewrites this file with tabs and breaks MPF.
# Edit in Cursor/VS Code only.

config:
  - _config_core.yaml
#  - config_virtual_only.yaml
#  - config_virtual_test.yaml

# FAST NET hardware (Neuron + Cabinet I/O + IO-3208 + IO-1616 + IO-0804)
hardware:
  platform: fast, virtual

fast:
  net:
    controller: neuron
    port: auto # <-- Windows: COM5, etc. Set your real port.
    baud: 921600
    io_loop:
      cab: { model: FP-I/O-0024, order: 1 } # Cabinet I/O board
      pf_lower: { model: FP-I/O-3208, order: 2 } # Lower playfield
      pf_upper: { model: FP-I/O-1616, order: 3 } # Upper playfield
      aux: { model: FP-I/O-0804, order: 4 } # Aux node
  exp:
    port: auto
    baud: 921600
    boards:
      neuron:
        model: FP-EXP-2000
      exp_led:
        model: FP-EXP-0081
        led_fade_time: 50ms

# Flippers (dual-wound; primary cab optos + separate EOS on 3208 J8)
flippers:
  left_flipper:
    main_coil: c_left_flipper_main
    hold_coil: c_left_flipper_hold
    activation_switch: s_left_flipper      # cab-8 primary opto
    eos_switch: s_left_eos                  # pf_lower-2
    use_eos: true
    enable_events: ball_started
    disable_events: ball_will_end, service_mode_entered

  right_flipper:
    main_coil: c_right_flipper_main
    hold_coil: c_right_flipper_hold
    activation_switch: s_right_flipper     # cab-16 primary opto
    eos_switch: s_right_eos                 # pf_lower-1
    use_eos: true
    enable_events: ball_started
    disable_events: ball_will_end, service_mode_entered
  # NO upper_flipper — secondary optos cab-9/cab-17 are defined but unused.

playfields:
  playfield:
    tags: default

machine:
  balls_installed: 6
  min_balls: 1

game:
  balls_per_game: 3
  max_players: 4

machine_vars:
  game_start_intro_playing:
    initial_value: 0
    value_type: int
    persist: false

variable_player:
  game_started:
    game_start_intro_playing:
      int: 1
      action: set_machine
  game_start_intro_done:
    game_start_intro_playing:
      int: 0
      action: set_machine
  ball_will_end:
    game_start_intro_playing:
      int: 0
      action: set_machine
  tilt:
    game_start_intro_playing:
      int: 0
      action: set_machine

widget_player:
  game_starting:
    gameplay_overlay:
      slide: base
      action: remove
  game_started:
    gameplay_overlay:
      slide: base
      action: remove
  game_start_intro_done:
    gameplay_overlay:
      slide: base
      priority: 300
  ball_search_started:
    ball_search_overlay:
      slide: _overlay
  ball_search_stopped:
    ball_search_overlay:
      slide: _overlay
      action: remove
  service_mode_entered:
    ball_search_overlay:
      slide: _overlay
      action: remove

slide_player:
  game_started:
    game_start_video:
      priority: 900
  # Batch 2 drain/tilt callouts (backbox / default display)
  tilt:
    callout_206_tilt:
      priority: 950
  # Skip ball-loss clip when this ball already tilted (MPF sets game.tilted=True
  # before posting tilt, then end_ball() → ball_ending).
  ball_ending{not game.tilted}:
    callout_208_drain:
      priority: 900
  # TODO(outlane hardware): 207 / 34 outlane callouts deferred — no
  # s_left_outlane / s_right_outlane switches or outlane-specific events yet.

sound_player:
  not_enough_credits:
    200a_highness_have_come_part:
      bus: voice

ball_saves:
  default_ball_save:
    active_time: 10s
    hurry_up_time: 3s
    grace_period: 2s
    enable_events: ball_started
    disable_events: ball_will_end
    auto_launch: true
    balls_to_save: 1

# Enable Credits mode with permanent free play
credits:
  enabled: true
  free_play: true
  free_play_string: "FREE PLAY"

# Global shot profiles used by modes
shot_profiles:
  single_hit:
    advance_on_hit: true
    states:
      - name: ready
      - name: complete

# ---- Lighting (pattern from Bootleggers colors.yaml / ball_saves.yaml) ----
named_colors:
  cta_gold: FFC21A
  warm_gi: F0B572

show_player:
  ball_save_default_ball_save_enabled:
    flash_color:
      key: ball_save_show
      speed: 3
      show_tokens: { lights: l_ball_save, color: 33CEFA }
  ball_save_default_ball_save_hurry_up:
    flash_color:
      key: ball_save_show
      speed: 6
      show_tokens: { lights: l_ball_save, color: 00BFFF }
  ball_save_default_ball_save_disabled:
    flash_color:
      key: ball_save_show
      action: stop

# Hold START 5 s during a game to end it (Bootleggers ts_start_button_long)
timed_switches:
  ts_start_long:
    switches: s_start
    time: 5s
    events_when_active: end_game
