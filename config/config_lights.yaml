#config_version=6

# Playfield LEDs on EXP-0081 (board name exp_led).
# Numbers from the physical chain walk: exp_led-<port>-<position>.
# Port 1 = 23 LEDs, Port 2 = 24, Port 8 = 20.
# Two-LED inserts: the original name is LED "a"; the partner is "_b".
# Both share a tag so a light_player or show can target the pair.
# l_lane_scoop and l_standup_lisa were not found on the walk and stay virtual.

